name: Release client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: book-taker-client-windows-x64.exe
          - os: ubuntu-latest
            artifact: book-taker-client-linux-x64
          - os: macos-latest
            artifact: book-taker-client-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[packaging]"
      - run: python tools/build_client.py
      - name: Upload client artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="Desktop client builds for Book Taker ${tag}.

          Download the file for your system, then open it. The client does not require a separate Python install.

          | System | File |
          | --- | --- |
          | Windows | \`book-taker-client-windows-x64.exe\` |
          | macOS (Apple silicon) | \`book-taker-client-macos-arm64\` |
          | Linux | \`book-taker-client-linux-x64\` |

          API keys stay in session memory and are not written to disk."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/book-taker-client-* --clobber
          else
            gh release create "$tag" dist/book-taker-client-* --title "Book Taker ${tag}" --notes "$notes"
          fi
